<body class="auth-page"><main class="auth-card"><a class="brand auth-brand" href="/"><span class="brand-mark">H</span><span>HireLens</span></a><div class="eyebrow">Recruiting workspace</div><h1>Welcome back.</h1><p class="intro">Sign in to manage your roles and candidate pipeline.</p>{% if error %}<div class="alert">{{ error }}</div>{% endif %}<form method="post" action="/login"><label>Email<input type="email" name="email" required autofocus placeholder="you@company.com"></label><label>Password<input type="password" name="password" required placeholder="Your password"></label><button class="button button-primary login-button" type="submit">Sign in <span>→</span></button></form><p class="auth-note">Local development access is configured through your environment settings.</p></main></body></html>
