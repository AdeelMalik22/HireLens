{% extends "dashboard/base.html" %}{% block title %}Create job · HireLens{% endblock %}
{% block content %}<div class="form-wrap"><a class="back-link" href="/dashboard">← Back to overview</a><div class="eyebrow">New opportunity</div><h1>Define your ideal candidate.</h1><p class="intro">Give your role enough context to make every future match more useful.</p><form class="card form-card" method="post" action="/dashboard/jobs"><label>Job title<input name="title" required placeholder="e.g. Senior Backend Engineer"></label><label>Job description<textarea name="description" required rows="7" placeholder="Describe the responsibilities, team, and what success looks like..."></textarea></label><div class="two-col"><label>Required skills <span class="hint">Comma separated</span><input name="required_skills" placeholder="Python, FastAPI, PostgreSQL"></label><label>Preferred skills <span class="hint">Comma separated</span><input name="preferred_skills" placeholder="Redis, Docker, AWS"></label></div><label>Minimum years of experience<input type="number" name="minimum_years_experience" min="0" value="0"></label><div class="form-actions"><a class="button button-quiet" href="/dashboard">Cancel</a><button class="button button-primary" type="submit">Create role <span>→</span></button></div></form></div>{% endblock %}
